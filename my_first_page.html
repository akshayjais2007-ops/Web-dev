<!--! +tab -->
<! DOCTYPE html>
 <html lang="en">

 <head>
     <!--extra info-->
     <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Page</title>   <!--title displays on the top of the webpage 
                                                           basically website name-->

 </head>

<body>
     <!--content-->
     <!--target (to open the link)-->
     <a 
     href="https://www.google.com/"
     target="_blank"
       >Google Portal <br>
     <!--Self = same page & Blank = new page-->
     <br>
     </a>
    
     <!--download-->
    
     <a 
     href="./download.jpeg"
     download
         >Download Image <br> <!-- This will download the image when clicked -->
     </a>
     
     <br>
     <!-- Task 3: Downloadable PDF file link -->
     <a 
     href="./document.pdf"
     download
         >Download PDF <br>
     </a>
     <br>
    
     <!-- Task 4: Display image with specific height and width -->
     <img 
     src="download.jpeg" 
     alt="Nature Image"> 
     Iron Man <br>
     <br>
    
     <!-- Task 5: Image with alt text -->
     <img 
     src="spiderman.jpeg"
     alt="Spider-Man"> 
     Spider-Man <br>
    
     <!-- Task 6: Download link for notes.pdf -->
     <a 
     href="./notes.pdf"
     download
         >Download Notes <br>
     </a>
     <br>
    
     <!-- Task 7: Load image lazily -->
     <img 
     src="lazy-image.jpeg" 
     loading="lazy"
     alt="Lazy Loaded Image">
     <br>
     
     <!-- Task 8: Image from images folder -->
     <img 
     src="images/photo.png" 
     alt="Photo from images folder">
     <br>
     
     <!-- Task 9: Link to about.html -->
     <br>
     <a 
     href="./about.html"
         >About Page <br> <!-- Link to about.html -->
     </a>
</body>
