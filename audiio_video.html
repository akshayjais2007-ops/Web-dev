<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Page</title>

</head>
<body>
    <h1>Video Page</h1>
    <video src ="./video.mp4" controls width="600" height="400">
        poster="./poster.jpg" <!-- This will show a poster image before the video starts playing -->
        muted <!-- This will mute the video by default -->
        autoplay <!-- This will make the video play automatically when the page loads -->
    </video>
        
    <audio src="./audio.mp3" controls>
        Your browser does not support the audio element.
    </audio>
</body>
</html>
