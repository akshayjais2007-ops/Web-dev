<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>iframe</title>
    </head>
    <body>
        <h1>iframe: to embed other websites</h1>
        <h2>Link Local Pages</h2>
        <iframe src="local-page.html" width="600" height="400"></iframe>
        <h2>External Pages</h2>
        <h3>YouTube</h3>
           title="Rick Astley - Never Gonna Give You Up (Video) - YouTube"
           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="600" height="400"></iframe>
        
        <h3>Vedam Student Portal</h3>
        <iframe src="https://vedam.org/embed" width="600" height="400"></iframe>

    </body>
</html>
